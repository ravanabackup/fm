<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VibeStream | Global Radio</title>
    <style>
        :root {
            --primary: #00f2ff;
            --secondary: #7000ff;
            --glass: rgba(15, 15, 20, 0.85);
            --card-bg: rgba(255, 255, 255, 0.03);
            --border: rgba(255, 255, 255, 0.1);
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: #050505;
            color: #fff;
            margin: 0;
            display: flex;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Sidebar Glassmorphism */
        nav {
            width: 260px;
            background: rgba(0, 0, 0, 0.9);
            border-right: 1px solid var(--border);
            padding: 40px 20px;
            position: fixed;
            height: 100vh;
            z-index: 100;
        }

        .logo {
            font-size: 1.6rem;
            font-weight: 900;
            background: linear-gradient(to right, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 50px;
            letter-spacing: -1px;
        }

        .nav-label {
            color: #555;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 20px;
            display: block;
        }

        .nav-item {
            padding: 12px 15px;
            border-radius: 12px;
            cursor: pointer;
            transition: 0.3s;
            margin-bottom: 8px;
            color: #aaa;
            display: flex;
            align-items: center;
        }

        .nav-item:hover {
            color: #fff;
            background: var(--card-bg);
        }

        .nav-item.active {
            background: rgba(0, 242, 255, 0.1);
            color: var(--primary);
            font-weight: 600;
        }

        /* Main Viewport */
        main {
            margin-left: 260px;
            width: calc(100% - 260px);
            padding: 50px;
            padding-bottom: 150px;
            background: radial-gradient(circle at top right, rgba(0, 242, 255, 0.05), transparent);
        }

        header h2 {
            font-size: 2.5rem;
            margin: 0 0 10px 0;
            font-weight: 700;
        }

        .tab-content {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 20px;
            margin-top: 40px;
            animation: slideUp 0.5s ease-out;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Station Cards */
        .station-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 15px;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            cursor: pointer;
            backdrop-filter: blur(10px);
        }

        .station-card:hover {
            background: rgba(255, 255, 255, 0.07);
            transform: translateY(-10px);
            border-color: var(--primary);
            box-shadow: 0 15px 30px rgba(0,0,0,0.5);
        }

        .artwork {
            width: 100%;
            aspect-ratio: 1;
            border-radius: 15px;
            background: linear-gradient(135deg, #1a1a1a, #000);
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            color: rgba(255,255,255,0.1);
            position: relative;
        }

        .play-icon {
            position: absolute;
            width: 45px;
            height: 45px;
            background: var(--primary);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #000;
            font-size: 1rem;
            opacity: 0;
            transform: scale(0.8);
            transition: 0.3s;
            box-shadow: 0 0 20px rgba(0, 242, 255, 0.4);
        }

        .station-card:hover .play-icon {
            opacity: 1;
            transform: scale(1);
        }

        .station-info b { display: block; margin-bottom: 3px; font-size: 0.9rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .station-info span { color: #666; font-size: 0.75rem; }

        /* Liquid Playback Bar */
        .player-bar {
            position: fixed;
            bottom: 20px;
            left: 280px;
            right: 20px;
            height: 100px;
            background: var(--glass);
            backdrop-filter: blur(25px);
            border: 1px solid var(--border);
            border-radius: 25px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 30px;
            z-index: 1000;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
        }

        .now-playing { display: flex; align-items: center; min-width: 250px; }
        
        .mini-art {
            width: 60px;
            height: 60px;
            border-radius: 12px;
            background: var(--secondary);
            margin-right: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            transition: transform 0.5s ease;
        }

        .playing .mini-art {
            animation: rotateArt 10s linear infinite;
            background: var(--primary);
            box-shadow: 0 0 20px rgba(0, 242, 255, 0.3);
        }

        @keyframes rotateArt { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        audio {
            filter: invert(1) hue-rotate(180deg) brightness(1.5);
            width: 350px;
            height: 40px;
        }

        @media (max-width: 900px) {
            nav { width: 80px; padding: 20px 10px; }
            nav .logo, nav .nav-label, nav .nav-item span { display: none; }
            main { margin-left: 80px; width: calc(100% - 80px); padding: 20px; }
            .player-bar { left: 20px; }
            audio { width: 200px; }
        }
    </style>
</head>
<body>

    <nav>
        <div class="logo">Vibe.</div>
        <span class="nav-label">Regions</span>
        <div class="nav-item active" onclick="switchTab('mp', this)"><span>Madhya Pradesh</span></div>
        <div class="nav-item" onclick="switchTab('kerala', this)"><span>Kerala</span></div>
        <div class="nav-item" onclick="switchTab('hindi', this)"><span>Hindi Central</span></div>
    </nav>

    <main>
        <header>
            <h2 id="viewTitle">Madhya Pradesh</h2>
            <p id="viewDesc" style="color: #666;">Streaming live from the heart of India.</p>
        </header>

        <div class="tab-content" id="stationGrid"></div>
    </main>

    <div class="player-bar" id="playerBar">
        <div class="now-playing">
            <div class="mini-art" id="artNode">📻</div>
            <div>
                <b id="trackName" style="display:block; font-size: 0.9rem;">Ready to Play</b>
                <span id="trackRegion" style="font-size: 0.75rem; color: #666;">Select a station</span>
            </div>
        </div>
        
        <div class="controls">
            <audio id="audioPlayer" controls></audio>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script>

                    { name: 'Akashvani Indore', url: 'https://air.pc.cdn.bitgravity.com/air/live/pbaudio212/playlist.m3u8' },
                    { name: 'VBS Indore', url: 'https://air.pc.cdn.bitgravity.com/air/live/pbaudio241/playlist.m3u8' },
                    { name: 'Akashvani Gwalior', url: 'https://air.pc.cdn.bitgravity.com/air/live/pbaudio205/playlist.m3u8' },
                    { name: 'Akashvani Jabalpur', url: 'https://air.pc.cdn.bitgravity.com/air/live/pbaudio167/playlist.m3u8' },
                    { name: 'Jabalpur FM', url: 'https://air.pc.cdn.bitgravity.com/air/live/pbaudio240/playlist.m3u8' },
                    { name: 'Akashvani Rewa', url: 'https://air.pc.cdn.bitgravity.com/air/live/pbaudio225/playlist.m3u8' },
                    { name: 'Akashvani Sagar', url: 'https://air.pc.cdn.bitgravity.com/air/live/pbaudio204/playlist.m3u8' },
                    { name: 'Akashvani Balaghat', url: 'https://air.pc.cdn.bitgravity.com/air/live/pbaudio091/playlist.m3u8' },

                    { name: 'Akashvani Chhindwara', url: 'https://air.pc.cdn.bitgravity.com/air/live/pbaudio113/playlist.m3u8' },

                    { name: 'Akashvani Khandwa', url: 'https://air.pc.cdn.bitgravity.com/air/live/pbaudio143/playlist.m3u8' },
                    { name: 'Akashvani Shivpuri', url: 'https://air.pc.cdn.bitgravity.com/air/live/pbaudio171/playlist.m3u8' },
                    { name: 'Akashvani Shahdol', url: 'https://air.pc.cdn.bitgravity.com/air/live/pbaudio228/playlist.m3u8' },
                    { name: 'Akashvani Betul', url: 'https://air.pc.cdn.bitgravity.com/air/live/pbaudio108/playlist.m3u8' }
                ]
            },
            kerala: {
                title: "Kerala",
                desc: "God's own country, streaming live in Malayalam.",
                stations: [
                    { name: 'Akashvani Kerala', url: 'https://air.pc.cdn.bitgravity.com/air/live/pbaudio230/playlist.m3u8' },
                    { name: 'VBS Malayalam', url: 'https://air.pc.cdn.bitgravity.com/air/live/pbaudio229/playlist.m3u8' },
                    { name: 'FM Rainbow Kochi', url: 'https://air.pc.cdn.bitgravity.com/air/live/pbaudio044/playlist.m3u8' },
                    { name: 'Akashvani Kochi', url: 'https://air.pc.cdn.bitgravity.com/air/live/pbaudio045/playlist.m3u8' },
                    { name: 'Akashvani Calicut', url: 'https://air.pc.cdn.bitgravity.com/air/live/pbaudio082/playlist.m3u8' },
                    { name: 'Real FM Kozhikode', url: 'https://air.pc.cdn.bitgravity.com/air/live/pbaudio083/playlist.m3u8' },
                    { name: 'Akashvani Trissur', url: 'https://air.pc.cdn.bitgravity.com/air/live/pbaudio036/playlist.m3u8' },
                    { name: 'Akashvani Kannur', url: 'https://air.pc.cdn.bitgravity.com/air/live/pbaudio173/playlist.m3u8' },
                    { name: 'Akashvani Manjeri', url: 'https://air.pc.cdn.bitgravity.com/air/live/pbaudio101/playlist.m3u8' },
                    { name: 'Akashvani Devikulam', url: 'https://air.pc.cdn.bitgravity.com/air/live/pbaudio214/playlist.m3u8' },
                    { name: 'Akashvani Ananthapuri', url: 'https://air.pc.cdn.bitgravity.com/air/live/pbaudio102/playlist.m3u8' }
                ]
            },
            hindi: {
                title: "Hindi Central",
                desc: "National news, Vividh Bharati, and Premium FM Gold.",
                stations: [
                    { name: 'Vividh Bharati National', url: 'https://air.pc.cdn.bitgravity.com/air/live/pbaudio001/playlist.m3u8' },
                    { name: 'FM Gold Delhi', url: 'https://airhlspush.pc.cdn.bitgravity.com/httppush/hlspbaudio005/hlspbaudio005_Auto.m3u8' },
                    { name: 'FM Rainbow Delhi', url: 'https://airhlspush.pc.cdn.bitgravity.com/httppush/hlspbaudio004/hlspbaudio004_Auto.m3u8' },
                    { name: 'VBS Delhi', url: 'https://airhlspush.pc.cdn.bitgravity.com/httppush/hlspbaudio238/hlspbaudio238_Auto.m3u8' },
                    { name: 'AIR News 24x7', url: 'https://airhlspush.pc.cdn.bitgravity.com/httppush/hlspbaudio002/hlspbaudio002_Auto.m3u8' },
                    { name: 'AIR Raagam', url: 'https://airhlspush.pc.cdn.bitgravity.com/httppush/hlspbaudioragam/hlspbaudioragam_Auto.m3u8' },
                    { name: 'Delhi Indraprastha', url: 'https://airhlspush.pc.cdn.bitgravity.com/httppush/hlspbaudio006/hlspbaudio006_Auto.m3u8' },
                    { name: 'Akashvani Lucknow', url: 'https://air.pc.cdn.bitgravity.com/air/live/pbaudio118/playlist.m3u8' },
                    { name: 'Akashvani Jaipur', url: 'https://air.pc.cdn.bitgravity.com/air/live/pbaudio008/playlist.m3u8' },
                    { name: 'Akashvani Patna', url: 'https://air.pc.cdn.bitgravity.com/air/live/pbaudio217/playlist.m3u8' },
                    { name: 'Akashvani Chandigarh', url: 'https://air.pc.cdn.bitgravity.com/air/live/pbaudio111/playlist.m3u8' },
                    { name: 'Akashvani Shimla', url: 'https://air.pc.cdn.bitgravity.com/air/live/pbaudio021/playlist.m3u8' }
                ]
            }
        };

        let hls = new Hls();
        const audioPlayer = document.getElementById('audioPlayer');

        function switchTab(regionKey, element) {
            document.querySelectorAll('.nav-item').forEach(nav => nav.classList.remove('active'));
            element.classList.add('active');
            
            const region = data[regionKey];
            document.getElementById('viewTitle').innerText = region.title;
            document.getElementById('viewDesc').innerText = region.desc;

            const grid = document.getElementById('stationGrid');
            grid.innerHTML = '';
            
            region.stations.forEach(s => {
                const card = document.createElement('div');
                card.className = 'station-card';
                card.innerHTML = `
                    <div class="artwork">📻<div class="play-icon">▶</div></div>
                    <div class="station-info">
                        <b>${s.name}</b>
                        <span>Live Stream</span>
                    </div>
                `;
                card.onclick = () => playStream(s.url, s.name, region.title);
                grid.appendChild(card);
            });
        }

        function playStream(url, name, region) {
            document.getElementById('trackName').innerText = name;
            document.getElementById('trackRegion').innerText = region;
            document.getElementById('playerBar').classList.add('playing');

            if (Hls.isSupported()) {
                hls.destroy();
                hls = new Hls();
                hls.loadSource(url);
                hls.attachMedia(audioPlayer);
                hls.on(Hls.Events.MANIFEST_PARSED, () => audioPlayer.play());
            } else {
                audioPlayer.src = url;
                audioPlayer.play();
            }
        }

        // Default to MP on load
        switchTab('mp', document.querySelector('.nav-item'));
    </script>
</body>
</html>
